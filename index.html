function Tasks({tasks,setTasks,leads}){
  const [showForm,setShowForm]=useState(false);
  const [filter,setFilter]=useState('active');
  const [form,setForm]=useState({title:'',cat:'פולו אפ',due:'',notes:'',done:false});

  const sf=(k,v)=>setForm(p=>({...p,[k]:v}));
  const addTask=()=>{if(!form.title.trim())return;setTasks(p=>[{...form,id:uid()},...p]);setForm({title:'',cat:'פולו אפ',due:'',notes:'',done:false});setShowForm(false)};
  const toggle=id=>setTasks(p=>{
    const target=p.find(t=>t.id===id);
    const updated=p.map(t=>t.id===id?{...t,done:!t.done}:t);
    // Auto-renew follow-up: when marking a follow task as done, if lead is still 'follow' and no other open follow task for that lead exists, create the next one in +2 days
    if(target&&!target.done&&target.kind==='follow'&&target.leadId){
      const lead=leads?.find(l=>l.id===target.leadId);
      if(lead&&lead.status==='follow'){
        const hasOpen=updated.some(t=>t.id!==id&&t.kind==='follow'&&t.leadId===target.leadId&&!t.done);
        if(!hasOpen){
          updated.unshift({id:uid(),leadId:lead.id,kind:'follow',title:`פולו אפ — ${lead.name}`,cat:'פולו אפ',due:addDays(new Date(),2),notes:'חזרי ללקוחה — שלחי הודעה ובדקי מה הסטטוס',done:false});
        }
      }
    }
    return updated;
  });
  const del=id=>setTasks(p=>p.filter(t=>t.id!==id));

  const now=new Date();
  const active=tasks.filter(t=>!t.done);
  const overdue=tasks.filter(t=>!t.done&&t.due&&new Date(t.due)<now);
  const filtered=tasks.filter(t=>{
    if(filter==='all')return true;
    if(filter==='active')return !t.done;
    if(filter==='done')return t.done;
    // category filter: only active (done tasks appear only under "הושלמו")
    return !t.done&&t.cat===filter;
  });
  // Lead of a task, only while still in play (closed leads don't need the hot/cold mark)
  const leadOf=t=>{const l=t.leadId?leads?.find(x=>x.id===t.leadId):null;return l&&l.status!=='closed'?l:null};
  // Hot leads first, cold last (stable sort keeps the existing order within each group)
  const sorted=filtered.map((t,i)=>({t,i,r:TEMP_RANK[leadOf(t)?.temp||'']})).sort((a,b)=>a.r-b.r||a.i-b.i).map(x=>x.t);

  return(
    <div>
      <div className="ph">
        <div><div className="pt">משימות עסקיות</div><div className="ps">{active.length} פעילות{overdue.length?` · ${overdue.length} באיחור`:''}</div></div>
        <button className="btn btn-p" onClick={()=>setShowForm(p=>!p)}>+ משימה חדשה</button>
      </div>
      {showForm&&<div className="card" style={{marginBottom:16,padding:18}}>
        <div style={{fontWeight:700,marginBottom:14,fontSize:14}}>משימה חדשה</div>
        <div className="fg2">
          <div className="fg" style={{gridColumn:'span 2'}}><label className="fl">כותרת</label><input className="fi" value={form.title} onChange={e=>sf('title',e.target.value)} placeholder="תיאור המשימה..."/></div>
          <div className="fg"><label className="fl">קטגוריה</label><select className="fi" value={form.cat} onChange={e=>sf('cat',e.target.value)}>{TASK_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
          <div className="fg"><label className="fl">תאריך יעד</label><input type="date" className="fi" value={form.due} onChange={e=>sf('due',e.target.value)}/></div>
          <div className="fg" style={{gridColumn:'span 2'}}><label className="fl">הערות</label><input className="fi" value={form.notes} onChange={e=>sf('notes',e.target.value)}/></div>
        </div>
        <div style={{display:'flex',gap:8}}><button className="btn btn-p btn-sm" onClick={addTask}>הוסף</button><button className="btn btn-s btn-sm" onClick={()=>setShowForm(false)}>ביטול</button></div>
      </div>}
      <div className="fb">
        {['active','all','done',...TASK_CATS].map(f=>(
          <button key={f} className={`btn btn-sm ${filter===f?'btn-p':'btn-s'}`} onClick={()=>setFilter(f)}>
            {f==='active'?'פעילות':f==='all'?'הכל':f==='done'?'הושלמו':f}
          </button>
        ))}
      </div>
      {filtered.length===0&&<div className="card" style={{padding:32,textAlign:'center',color:'var(--text3)',fontSize:13}}>אין משימות כאן</div>}
      {sorted.map(t=>{
        const isOD=!t.done&&t.due&&new Date(t.due)<now;
        return <div key={t.id} className={`task-card ${t.done?'done-task':''}`}>
          <input type="checkbox" checked={t.done} onChange={()=>toggle(t.id)} style={{width:16,height:16,marginTop:2,cursor:'pointer',flexShrink:0}}/>
          <div style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
              <span style={{fontWeight:600,fontSize:13.5,textDecoration:t.done?'line-through':'none'}}><TempName lead={leadOf(t)}>{t.title}</TempName></span>
              <span style={{fontSize:11,fontWeight:600,color:CAT_CSS[t.cat]||'var(--text3)'}}>{t.cat}</span>
              {t.due&&<span style={{fontSize:11,color:isOD?'var(--red)':'var(--text3)',fontWeight:isOD?700:400}}>{isOD?'⚠ ':''}{fmt(t.due)}</span>}
            </div>
            {t.notes&&<div style={{fontSize:12,color:'var(--text2)',marginTop:3}}>{t.notes}</div>}
          </div>
          <button className="btn btn-icon btn-g" style={{color:'var(--red)'}} onClick={()=>del(t.id)}>✕</button>
        </div>;
      })}
    </div>
  );
}

// Hook: sync state with Firestore document, fall back to localStorage if Firebase isn't ready
function useSyncedState(uid,docName,defaultValue,localKey){
  const [data,setData]=useState(defaultValue);
  const [loaded,setLoaded]=useState(false);
  const skipNextWrite=useRef(false);
  const firestoreReady=useRef(false);
  const useFirestore=window.FIREBASE_READY&&uid;

  // Initial load + listener
  useEffect(()=>{
    firestoreReady.current=false;
    setLoaded(false);
    if(!useFirestore){
      // localStorage mode
      const local=load(localKey,defaultValue);
      skipNextWrite.current=true;
      setData(local);
      firestoreReady.current=true;
      setLoaded(true);
      return;
    }
    const docRef=firebase.firestore().doc(`users/${uid}/data/${docName}`);
    const unsub=docRef.onSnapshot(snap=>{
      if(snap.exists){
        const remote=snap.data().value;
        skipNextWrite.current=true;
        setData(remote===undefined?defaultValue:remote);
      }else{
        // First time on this account: migrate localStorage if there's any
        const local=load(localKey,defaultValue);
        const hasLocal=Array.isArray(local)?local.length>0:(local&&Object.keys(local).length>0);
        if(hasLocal){
          // Let the writer push local data up to Firestore (no skipNextWrite)
          setData(local);
        }else{
          skipNextWrite.current=true;
          setData(defaultValue);
        }
      }
      firestoreReady.current=true;
      setLoaded(true);
    },err=>{
      console.error('Firestore listen error:',err);
      // On error, DON'T mark firestoreReady — avoid overwriting cloud data
      setLoaded(true);
    });
    return()=>unsub();
  },[useFirestore,uid,docName]);

  // Persist on change (debounced)
  useEffect(()=>{
    if(!loaded)return;
    if(skipNextWrite.current){skipNextWrite.current=false;return;}
    // Always mirror to localStorage as a backup
    save(localKey,data);
    if(!useFirestore)return;
    if(!firestoreReady.current)return; // wait for first remote read
    const docRef=firebase.firestore().doc(`users/${uid}/data/${docName}`);
    const t=setTimeout(()=>{
      docRef.set({value:data,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
        .catch(err=>console.error('Firestore save error:',err));
    },500);
    return()=>clearTimeout(t);
  },[data,loaded,useFirestore,uid,docName]);

  return[data,setData,loaded];
}

  msgCold:'היי {שם} 😊 מקווה שהכול טוב אצלך! משאירה לך פה משהו קטן שיעשה לך חיוך 👇\n{סרטון}',
};
function PhoneAdder({onSave}){
  const [v,setV]=useState('');
  return <div style={{display:'flex',gap:6,marginTop:10,flexWrap:'wrap'}}>
    <input className="fi" type="tel" dir="ltr" style={{flex:'1 1 130px',minWidth:0}} placeholder="אין טלפון — הוסיפי" value={v} onChange={e=>setV(e.target.value)}/>
    {CAN_PICK_CONTACT&&<button className="btn btn-s btn-sm" onClick={async()=>{const c=await pickContact();if(c.tel)onSave(c.tel)}}>📇 מאנשי קשר</button>}
    <button className="btn btn-p btn-sm" disabled={!waPhone(v)} onClick={()=>onSave(v)}>שמור</button>
  </div>;
}
function NurturePage({leads,setLeads,batch,setBatch,tweaks,setTweaks}){
  const today=todayStr();
  const upd=(id,fn)=>setLeads(p=>p.map(l=>l.id===id?fn(l):l));
  const touch=l=>upd(l.id,x=>({...x,lastTouch:today,touches:[...(x.touches||[]),today]}));
  const undo=l=>upd(l.id,x=>{const t=(x.touches||[]).slice(0,-1);return{...x,touches:t,lastTouch:t[t.length-1]||''}});
  const skip=id=>setBatch(b=>({...b,skipped:[...(b.skipped||[]),id]}));
  const unskip=id=>setBatch(b=>({...b,skipped:(b.skipped||[]).filter(x=>x!==id)}));
  const stop=l=>{if(confirm(`להפסיק לפנות אל ${l.name}?`))upd(l.id,x=>({...x,nurtureOff:true}))};
  const toLost=l=>upd(l.id,x=>({...x,status:'lost',lostReason:x.lostReason||'חוסר מענה'}));
  const more=()=>setBatch(b=>({...b,ids:[...b.ids,...pickNurtureBatch(leads,today,new Set(b.ids),5)]}));
  const tw=(k,v)=>setTweaks(p=>({...p,[k]:v}));
  const msgFor=(l,track)=>{
    const first=(l.name||'').trim().split(/\s+/)[0]||'';
    // Hot leads get a personal message — only the greeting is prefilled
    if(track==='hot')return `היי ${first} 💛 `;
    const k=track==='far'?'msgFar':'msgCold';
    return (tweaks[k]??MSG_DEFAULTS[k]).replace(/\{שם\}/g,first).replace(/\{סרטון\}/g,tweaks.reelUrl||'').trim();
  };
  const igUrl=h=>/^https?:/i.test(h)?h:`https://instagram.com/${h.replace(/^@/,'').trim()}`;

  const rows=(batch?.ids||[]).map(id=>leads.find(l=>l.id===id)).filter(Boolean).map(l=>({
    l,info:nurtureInfo(l,today),
    sent:!!l.lastTouch&&l.lastTouch>=batch.week,
    skipped:(batch.skipped||[]).includes(l.id),
  // A lead that left its track (closed, lost, stopped) drops off the list
  })).filter(r=>r.info||r.sent).sort((a,b)=>(a.sent-b.sent)||(a.skipped-b.skipped));
  const pending=rows.filter(r=>!r.sent&&!r.skipped).length;
  const sentN=rows.filter(r=>r.sent).length;
  const totals={hot:0,far:0,cold:0};
  let waiting=0;
  const inBatch=new Set(batch?.ids||[]);
  leads.forEach(l=>{const i=nurtureInfo(l,today);if(!i)return;totals[i.track]++;if(i.due&&!inBatch.has(l.id))waiting++});

  return(
    <div>
      <div className="ph">
        <div><div className="pt">נטוורקינג</div><div className="ps">הרשימה של השבוע · {pending} ממתינות{sentN?` · ${sentN} נשלחו`:''}</div></div>
      </div>
      <div className="card" style={{padding:'12px 16px',marginBottom:14}}>
        <label className="fl">הסרטון האחרון שלך (לינק מאינסטגרם)</label>
        <input className="fi" dir="ltr" value={tweaks.reelUrl||''} onChange={e=>tw('reelUrl',e.target.value)} placeholder="https://www.instagram.com/reel/..."/>
        {!tweaks.reelUrl&&<div style={{fontSize:11,color:'var(--text3)',marginTop:6}}>בלי לינק, ההודעות לרחוקות ולקרות ייפתחו בלי סרטון</div>}
        <details style={{marginTop:10}}>
          <summary style={{fontSize:12,color:'var(--text2)',cursor:'pointer'}}>נוסח ההודעות</summary>
          <div style={{fontSize:11,color:'var(--text3)',margin:'8px 0'}}>{'{שם}'} יוחלף בשם הפרטי, {'{סרטון}'} בלינק שלמעלה. לחמות אין נוסח — את כותבת בעצמך.</div>
          <label className="fl">🌙 רחוקות</label>
          <textarea className="fi" rows={3} style={{marginBottom:8}} value={tweaks.msgFar??MSG_DEFAULTS.msgFar} onChange={e=>tw('msgFar',e.target.value)}/>
          <label className="fl">❄️ קרות</label>
          <textarea className="fi" rows={3} value={tweaks.msgCold??MSG_DEFAULTS.msgCold} onChange={e=>tw('msgCold',e.target.value)}/>
        </details>
      </div>

      {rows.length===0&&<div className="card" style={{padding:24,textAlign:'center',color:'var(--text2)',fontSize:13,lineHeight:1.7}}>
        אין אף אחת ברשימה השבוע.<br/>לידים נכנסים לכאן לבד: "לא נסגר" + חם, לקוחות עבר, סטטוס "רחוק", ולידים קרים או שלא ענו.
      </div>}

      {rows.map(({l,info,sent,skipped})=>{
        const phone=waPhone(l.phone);
        return <div key={l.id} className="card" style={{padding:'14px 16px',marginBottom:10,opacity:sent||skipped?.55:1}}>
          <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
            <span style={{fontWeight:700,fontSize:15}}>{l.name}</span>
            {info&&<span className="badge bgr">{TRACKS[info.track].label}</span>}
            {l.status==='closed'&&<span className="badge bg">לקוחה</span>}
            {sent&&<span className="badge bg">✓ נשלח</span>}
            {skipped&&!sent&&<span className="badge bgr">דילגת השבוע</span>}
          </div>
          {info&&!sent&&!skipped&&<>
            <div style={{fontSize:13,marginTop:6}}>{info.reason}</div>
            <div style={{fontSize:12,color:'var(--text2)',marginTop:3}}>💡 {info.hint}</div>
            {!phone&&<PhoneAdder onSave={v=>upd(l.id,x=>({...x,phone:v}))}/>}
          </>}
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:12}}>
            {sent&&<button className="btn btn-s btn-sm" onClick={()=>undo(l)}>↩ ביטול</button>}
            {skipped&&!sent&&<button className="btn btn-s btn-sm" onClick={()=>unskip(l.id)}>↩ החזירי לרשימה</button>}
            {info&&!sent&&!skipped&&<>
              {phone&&<a className="btn btn-sm" style={{background:'#25D366',color:'#fff',textDecoration:'none'}} href={`https://wa.me/${phone}?text=${encodeURIComponent(msgFor(l,info.track))}`} target="_blank" rel="noopener" onClick={()=>touch(l)}>וואטסאפ</a>}
              {l.instagram&&<a className="btn btn-s btn-sm" style={{textDecoration:'none'}} href={igUrl(l.instagram)} target="_blank" rel="noopener">אינסטגרם</a>}
              <button className="btn btn-s btn-sm" onClick={()=>touch(l)}>✓ נשלח</button>
              <button className="btn btn-s btn-sm" onClick={()=>skip(l.id)}>דלגי השבוע</button>
              {info.track==='cold'&&info.n>=COLD_MAX&&<button className="btn btn-s btn-sm" style={{color:'var(--red)'}} onClick={()=>toLost(l)}>להעביר ל"לא נסגר"</button>}
              <button className="btn btn-g btn-sm" style={{color:'var(--text3)'}} onClick={()=>stop(l)}>להפסיק</button>
            </>}
          </div>
        </div>;
      })}

      <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',marginTop:16,fontSize:12,color:'var(--text2)'}}>
        <span>בסך הכול במסלולים: 🔥 {totals.hot} · 🌙 {totals.far} · ❄️ {totals.cold}</span>
        {waiting>0&&<button className="btn btn-s btn-sm" onClick={more}>+ עוד 5 ({waiting} מחכות)</button>}
      </div>
    </div>
  );
}

// ── APP INSTALL + PUSH NOTIFICATIONS ─────────────────────────────
const VAPID_PUBLIC_KEY='BLBYGI3VXO-_kgb5UaNUjrR5eZdojuC55wMH4ZbUkfG6mv9OXGRvYned7WtrHIqSyl9wfxqprrMjvV46K9e6--w';
const PUSH_SUPPORTED='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const swReady='serviceWorker' in navigator?navigator.serviceWorker.register('sw.js').catch(err=>{console.error('SW register error:',err);return null}):Promise.resolve(null);
let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;window.dispatchEvent(new Event('installable'))});
function b64ToBytes(b){const s=atob((b+'='.repeat((4-b.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))}

// Sidebar controls: install the app + turn on task notifications for this device
function DeviceControls({uid}){
  const [canInstall,setCanInstall]=useState(!!installPrompt);
  const [push,setPush]=useState('off'); // off | on | busy | denied
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);

  useEffect(()=>{
    const h=()=>setCanInstall(!!installPrompt);
    window.addEventListener('installable',h);
    return()=>window.removeEventListener('installable',h);
  },[]);
  useEffect(()=>{
    if(!PUSH_SUPPORTED)return;
    if(Notification.permission==='denied'){setPush('denied');return;}
    swReady.then(reg=>reg&&reg.pushManager.getSubscription()).then(sub=>{if(sub&&Notification.permission==='granted')setPush('on')}).catch(()=>{});
  },[]);

  const install=async()=>{
    if(!installPrompt)return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt=null;setCanInstall(false);
  };
  const enablePush=async()=>{
    setPush('busy');
    try{
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){setPush(perm==='denied'?'denied':'off');return;}
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToBytes(VAPID_PUBLIC_KEY)});
      // Store this device's subscription so the daily job can reach it
      const docRef=firebase.firestore().doc(`users/${uid}/data/push`);
      const snap=await docRef.get();
      const json=sub.toJSON();
      const others=((snap.exists&&snap.data().value)||[]).filter(x=>x.endpoint!==json.endpoint);
      await docRef.set({value:[...others,json],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
      setPush('on');
      reg.showNotification('ההתראות פועלות ✓',{body:'מעכשיו תקבלי כל בוקר התראה על כל משימה של היום',icon:'icon-192.png',badge:'icon-192.png',dir:'rtl',lang:'he'});
    }catch(err){
      console.error('Push enable error:',err);
      alert('לא הצלחתי להפעיל התראות: '+err.message);
      setPush('off');
    }
  };

  const btn={width:'100%',padding:'7px 10px',marginTop:8,background:'rgba(255,255,255,.08)',border:'1px solid rgba(255,255,255,.12)',borderRadius:7,color:'rgba(255,255,255,.8)',fontFamily:'Heebo',fontSize:11,cursor:'pointer',textAlign:'right'};
  const note={marginTop:8,fontSize:10,lineHeight:1.5,color:'rgba(255,255,255,.4)'};
  return <>
    {canInstall&&<button style={btn} onClick={install}>📲 התקנת האפליקציה</button>}
    {isIOS&&!standalone&&<div style={note}>להתקנה ולהתראות באייפון: בספארי ← שיתוף ← "הוסף למסך הבית", ואז לפתוח מהאייקון</div>}
    {window.FIREBASE_READY&&uid&&PUSH_SUPPORTED&&<>
      {push==='on'&&<div style={note}>🔔 התראות פעילות במכשיר הזה</div>}
      {push==='denied'&&<div style={note}>🔕 ההתראות חסומות — יש לאפשר אותן בהגדרות המכשיר</div>}
      {(push==='off'||push==='busy')&&<button style={btn} disabled={push==='busy'} onClick={enablePush}>🔔 {push==='busy'?'מפעיל...':'הפעלת התראות'}</button>}
    </>}
  </>;
}

function App(){
  // Auth state
  const [user,setUser]=useState(null);
  const [authReady,setAuthReady]=useState(!window.FIREBASE_READY);

  useEffect(()=>{
    if(!window.FIREBASE_READY){setAuthReady(true);return;}
    const unsub=firebase.auth().onAuthStateChanged(u=>{
      setUser(u);
      setAuthReady(true);
    });
    return()=>unsub();
  },[]);

  const uid=user?.uid||null;

  // Synced state (Firestore if logged in, else localStorage)
  const [leads,setLeads,leadsLoaded]=useSyncedState(uid,'leads',typeof REAL_LEADS!=='undefined'?REAL_LEADS:[],'biz_leads3');
  const [tasks,setTasks,tasksLoaded]=useSyncedState(uid,'tasks',[],'biz_tasks');
  const [nurture,setNurture,nurtureLoaded]=useSyncedState(uid,'nurture',{week:'',ids:[],skipped:[]},'biz_nurture');
  const [tweaks,setTweaks]=useSyncedState(uid,'tweaks',TWEAK_DEFAULTS,'biz_tweaks');

  const [page,setPage]=useState(()=>new URLSearchParams(location.search).get('page')||localStorage.getItem('biz_page')||'dashboard');
  const [showTweaks,setShowTweaks]=useState(false);
  const [sidebarOpen,setSidebarOpen]=useState(false);

  useEffect(()=>localStorage.setItem('biz_page',page),[page]);
  // A tapped notification asks the already-open app to jump to a page
  useEffect(()=>{
    if(!('serviceWorker' in navigator))return;
    const h=e=>{if(e.data?.page)setPage(e.data.page)};
    navigator.serviceWorker.addEventListener('message',h);
    return()=>navigator.serviceWorker.removeEventListener('message',h);
  },[]);
  // Close sidebar on page change (mobile)
  useEffect(()=>setSidebarOpen(false),[page]);

  // Auto-clean tasks: remove tasks that no longer match their lead's status
  useEffect(()=>{
    if(!leads||!tasks||!leads.length||!tasks.length)return;
    const leadById=new Map(leads.map(l=>[l.id,l]));
    let moved=false;
    // Questionnaire check is due 2 days before the event (older tasks were created at 1 day before)
    const cleaned=tasks.filter(t=>isTaskStillValid(t,leadById,leads)).map(t=>{
      if(t.done||t.kind!=='questionnaire-verify'||!t.leadId)return t;
      const lead=leadById.get(t.leadId);
      const due=lead?.eventDate?addDays(new Date(lead.eventDate),-2):t.due;
      if(due===t.due)return t;
      moved=true;
      return{...t,due,title:`שאלון הכנה לאירוע — ${lead.brideName||lead.name}`};
    });
    if(moved||cleaned.length!==tasks.length){
      setTasks(cleaned);
    }
  },[leads,tasks]);

  // Stay-in-touch automation: wake far leads 3 months before their date,
  // and plan dated touchpoints for hot leads that didn't close
  useEffect(()=>{
    if(!leadsLoaded||!tasksLoaded||!leads.length)return;
    const today=todayStr();
    const newTasks=[];
    let dirty=false;
    const next=leads.map(l=>{
      if(l.status==='far'&&l.eventDate&&l.eventDate>=today&&daysBetween(today,l.eventDate)<=90){
        dirty=true;
        newTasks.push({id:makeId(),leadId:l.id,kind:'follow',title:`פולו אפ — ${l.name}`,cat:'פולו אפ',due:today,notes:'האירוע בעוד פחות מ-3 חודשים — עכשיו הזמן לסגור',done:false});
        return{...l,status:'follow',followDate:today};
      }
      if(l.status==='lost'&&l.temp==='hot'&&l.eventDate&&!l.nurtureOff){
        const made=l.nurtureMade||[];
        const nextYear=(+l.eventDate.slice(0,4)+1)+l.eventDate.slice(4);
        const plan=[
          ['how-was-it',addDays(new Date(l.eventDate),1),`איך היה? — ${l.name}`,'האירוע שלה היה אתמול — שאלי איך היה'],
          ['next-year',addDays(new Date(nextYear),-60),`שנה אחרי — ${l.name}`,'בשנה שעברה היית תפוסה בתאריך שלה — הציעי לשמור לה את השנה'],
        ];
        const added=[];
        plan.forEach(([kind,due,title,notes])=>{
          const key=kind+':'+l.eventDate;
          if(made.includes(key)||due<today)return;
          added.push(key);
          newTasks.push({id:makeId(),leadId:l.id,kind,forDate:l.eventDate,title,cat:'שיווק',due,notes,done:false});
        });
        if(added.length){dirty=true;return{...l,nurtureMade:[...made,...added]}}
      }
      return l;
    });
    if(dirty){setLeads(next);setTasks(p=>[...newTasks,...p]);}
  },[leads,leadsLoaded,tasksLoaded]);

  // Build this week's networking list once per week
  useEffect(()=>{
    if(!leadsLoaded||!nurtureLoaded||!leads.length)return;
    const today=todayStr();
    const week=weekStart(today);
    if(nurture?.week===week)return;
    setNurture({week,ids:pickNurtureBatch(leads,today),skipped:[]});
  },[leads,leadsLoaded,nurtureLoaded,nurture?.week]);

  useEffect(()=>{
    if(tweaks?.accentHue){
      document.documentElement.style.setProperty('--accent',`oklch(50% .19 ${tweaks.accentHue})`);
      document.documentElement.style.setProperty('--accentbg',`oklch(97% .04 ${tweaks.accentHue})`);
    }
  },[tweaks?.accentHue]);

  const applyTweak=(k,v)=>setTweaks(p=>({...p,[k]:v}));
  const signOut=()=>{if(confirm('להתנתק?'))firebase.auth().signOut()};

  // Recovery: detect when local backup has more data than what's loaded
  const [dismissedRecovery,setDismissedRecovery]=useState(false);
  const backupLeads=useMemo(()=>load('biz_leads3',[]),[user?.uid,dismissedRecovery]);
  const backupTasks=useMemo(()=>load('biz_tasks',[]),[user?.uid,dismissedRecovery]);
  const showRecovery=user&&!dismissedRecovery&&(backupLeads.length>leads.length||backupTasks.length>tasks.length);
  const restoreFromBackup=()=>{
    if(backupLeads.length>leads.length)setLeads(backupLeads);
    if(backupTasks.length>tasks.length)setTasks(backupTasks);
    setDismissedRecovery(true);
    setTimeout(()=>alert('שוחזר! הנתונים מועלים לענן... מסתנכרן עכשיו לכל המכשירים.'),300);
  };

  // Loading screen
  if(!authReady)return <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',color:'var(--text2)'}}>טוען...</div>;
  // Login screen (only if Firebase is configured)
  if(window.FIREBASE_READY&&!user)return <LoginScreen/>;

  const nav=[
    {id:'dashboard',l:'דשבורד',Icon:Icons.dashboard},
    {id:'leads',l:'לידים',Icon:Icons.leads},
    {id:'events',l:'אירועים',Icon:Icons.events},
    {id:'analytics',l:'ניתוח המרות',Icon:Icons.analytics},
    {id:'tasks',l:'משימות',Icon:Icons.tasks},
    {id:'nurture',l:'נטוורקינג',Icon:Icons.nurture},
  ];

  return(
    <div className="app">
      <button className="menu-btn" onClick={()=>setSidebarOpen(p=>!p)} aria-label="תפריט">{sidebarOpen?'✕':'☰'}</button>
      <div className={`sidebar-backdrop ${sidebarOpen?'open':''}`} onClick={()=>setSidebarOpen(false)}/>
      <nav className={`sidebar ${sidebarOpen?'open':''}`}>
        <div className="sidebar-logo">
          <h1>{tweaks.businessName}</h1>
          <p>ניהול לידים ואירועים</p>
        </div>
        <div className="sidebar-nav">
          {nav.map(({id,l,Icon})=>(
            <div key={id} className={`nav-item ${page===id?'active':''}`} onClick={()=>setPage(id)}>
              <Icon/>{l}
            </div>
          ))}
        </div>
        <div className="sidebar-foot">
          {leads.length} לידים · {leads.filter(l=>l.status==='closed').length} אירועים
          {user&&<div style={{marginTop:8,padding:'8px 0',borderTop:'1px solid rgba(255,255,255,.07)',display:'flex',alignItems:'center',gap:6}}>
            {user.photoURL&&<img src={user.photoURL} alt="" style={{width:20,height:20,borderRadius:'50%'}}/>}
            <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:10}}>{user.displayName||user.email}</span>
            <span onClick={signOut} style={{cursor:'pointer',color:'rgba(255,255,255,.5)',fontSize:10}} title="התנתק">⎋</span>
          </div>}
          <DeviceControls uid={uid}/>
        </div>
      </nav>
      <main className="main">
        {showRecovery&&<div style={{background:'oklch(97% .04 80)',border:'1px solid oklch(88% .08 80)',borderRadius:10,padding:'14px 16px',marginBottom:18,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <div style={{fontSize:22}}>💾</div>
          <div style={{flex:1,minWidth:200}}>
            <div style={{fontWeight:700,color:'#7a5208',fontSize:14}}>נמצא גיבוי מקומי</div>
            <div style={{color:'#7a5208',fontSize:12,marginTop:2}}>במחשב הזה יש {backupLeads.length} לידים ו-{backupTasks.length} משימות שלא נמצאים בענן. לשחזר?</div>
          </div>
          <button className="btn btn-sm" style={{background:'#7a5208',color:'#fff'}} onClick={restoreFromBackup}>שחזר לענן</button>
          <button className="btn btn-sm btn-s" onClick={()=>setDismissedRecovery(true)}>בטל</button>
        </div>}
        {page==='dashboard'&&<Dashboard leads={leads}/>}
        {page==='leads'&&<LeadsPage leads={leads}
          setTasks={setTasks}
          onAdd={l=>setLeads(p=>[l,...p])}
          onEdit={l=>setLeads(p=>p.map(x=>x.id===l.id?l:x))}
          onDelete={id=>{setLeads(p=>p.filter(l=>l.id!==id));setTasks(p=>p.filter(t=>t.leadId!==id))}}
          onDeleteMany={ids=>{const s=new Set(ids);setLeads(p=>p.filter(l=>!s.has(l.id)));setTasks(p=>p.filter(t=>!s.has(t.leadId)))}}
        />}
        {page==='events'&&<EventsPage leads={leads} onEdit={l=>setLeads(p=>p.map(x=>x.id===l.id?l:x))}/>}
        {page==='analytics'&&<Analytics leads={leads}/>}
        {page==='tasks'&&<Tasks tasks={tasks} setTasks={setTasks} leads={leads}/>}
        {page==='nurture'&&<NurturePage leads={leads} setLeads={setLeads} batch={nurture} setBatch={setNurture} tweaks={tweaks} setTweaks={setTweaks}/>}
      </main>
      {showTweaks&&<div className="tweaks-panel">
        <div style={{fontWeight:700,marginBottom:12,fontSize:13}}>Tweaks</div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:4}}>שם העסק</div>
          <input className="fi" style={{fontSize:12}} value={tweaks.businessName} onChange={e=>applyTweak('businessName',e.target.value)}/>
        </div>
        <div>
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:4}}>צבע ראשי (Hue {tweaks.accentHue}°)</div>
          <input type="range" min={0} max={360} value={tweaks.accentHue} onChange={e=>applyTweak('accentHue',+e.target.value)} style={{width:'100%'}}/>
          <div style={{display:'flex',gap:6,marginTop:8,flexWrap:'wrap'}}>
            {[22,200,330,145,280].map(h=><div key={h} onClick={()=>applyTweak('accentHue',h)} style={{width:20,height:20,borderRadius:'50%',background:`oklch(50% .19 ${h})`,cursor:'pointer',border:tweaks.accentHue===h?'2px solid var(--text)':'2px solid transparent'}}/>)}
          </div>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
